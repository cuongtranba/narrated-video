name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # A user token rather than GITHUB_TOKEN, for one reason: a PR authored by
      # github-actions[bot] gets its workflow runs held at action_required until
      # a human approves them, so every release PR showed up "failing" while its
      # CI had simply never run. A PR authored by a person triggers CI normally.
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v7.0.1
        if: ${{ steps.release.outputs.release_created }}

      # The same binaries that are committed, published as release assets with
      # checksums. A project scaffolded by `nv init` carries a shim that falls
      # back to this download when the skill is not installed — CI, most often —
      # so the release and that fallback path cannot drift apart.
      - name: Attach the binaries and their checksums
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          cd skills/narrated-video/bin
          for dir in */; do
            platform=${dir%/}
            tar -czf "/tmp/nv-$platform.tar.gz" -C "$platform" nv
          done
          (cd /tmp && sha256sum nv-*.tar.gz > checksums.txt)

          # --repo is not optional here: gh infers the repository from the git
          # remote, and the checksums are written in /tmp, which is not one.
          gh release upload "$TAG" /tmp/nv-*.tar.gz /tmp/checksums.txt \
            --repo "${{ github.repository }}" --clobber
