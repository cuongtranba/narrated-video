name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.6"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: go vet ./...
      - run: go test -race ./...

  # Ensures the committed binaries match the source they were built from.
  # For non-fork PRs and pushes to main: builds and commits automatically using
  # RELEASE_PLEASE_TOKEN (a user token) so the bot commit retriggers CI normally.
  # For fork and Dependabot PRs where CI cannot push back: fails with a clear
  # message so the contributor knows to run `make binaries` locally.
  build-binaries:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write
    steps:
      # Check out the actual branch head (not the detached merge commit that the
      # default PR checkout produces) so we can push back to it when needed.
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Check whether binaries need rebuilding
        id: check
        run: |
          source_at=$(git log -1 --format=%ct -- cmd internal kit go.mod go.sum)
          binaries_at=$(git log -1 --format=%ct -- skills/narrated-video/bin)

          source_at=${source_at:-0}
          binaries_at=${binaries_at:-0}

          echo "newest source commit:   $(date -u -d @"$source_at" 2>/dev/null || date -u -r "$source_at")"
          echo "newest binary commit:   $(date -u -d @"$binaries_at" 2>/dev/null || date -u -r "$binaries_at")"

          if [ "$source_at" -gt "$binaries_at" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail when CI cannot push stale binaries back
        if: |
          steps.check.outputs.needed == 'true' &&
          (github.event.pull_request.head.repo.fork == true ||
           github.actor == 'dependabot[bot]')
        run: |
          echo "::error::Binaries are stale and CI cannot push to this branch (fork or Dependabot PR). Run 'make binaries', commit the result, and push."
          git log --oneline -3 -- cmd internal kit go.mod go.sum
          exit 1

      - uses: actions/setup-go@v7.0.0
        if: steps.check.outputs.needed == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Rebuild binaries
        if: steps.check.outputs.needed == 'true'
        run: make binaries

      - name: Commit and push rebuilt binaries
        if: steps.check.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skills/narrated-video/bin
          git commit -m "build: rebuild nv binaries"
          git push

  # Everything a user does on day one — run against the COMMITTED binary, not a
  # fresh build. That is the artifact people actually install, so it is the one
  # whose behaviour has to be checked; a stale commit fails here rather than in
  # someone's first hour with the tool.
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2

      - name: Scaffold, and expect exactly the two failures a fresh project has
        run: |
          nv="$GITHUB_WORKSPACE/skills/narrated-video/bin/nv"
          mkdir -p /tmp/demo && cd /tmp/demo
          "$nv" init .

          failing=$("$nv" validate --json | jq -r '.[] | select(.OK == false) | .ID' | sort | tr '\n' ' ')
          echo "failing: $failing"
          [ "$failing" = "CHK-05 CHK-06 " ] || { echo "::error::expected CHK-05 and CHK-06, got: $failing"; exit 1; }

      - name: Synthesize with no API key, then expect a clean gate
        run: |
          nv="$GITHUB_WORKSPACE/skills/narrated-video/bin/nv"
          cd /tmp/demo
          "$nv" voiceover
          "$nv" validate

      - name: Regenerating changes nothing
        run: |
          nv="$GITHUB_WORKSPACE/skills/narrated-video/bin/nv"
          cd /tmp/demo
          "$nv" sync
          "$nv" validate

      # A new Remotion release breaking the template should surface here, not in
      # someone's first hour with the tool.
      - name: The scaffolded project type-checks and its compositions resolve
        run: |
          cd /tmp/demo
          bun install
          bunx tsc --noEmit
          bunx remotion compositions src/index.ts
