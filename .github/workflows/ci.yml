name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.6"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: go vet ./...
      - run: go test -race ./...

  # The binaries are committed so an install needs no build, which raises one
  # question: are they still the ones this source produces?
  #
  # Byte-comparing a rebuild does not answer it. Two installations of the same
  # Go version — Homebrew's and the one this runner downloads — emit binaries of
  # identical size and differing bytes even under -trimpath -buildid=, so that
  # check fails on every push from a laptop while proving nothing.
  #
  # Commit order answers it directly and deterministically: if the newest commit
  # touching the source is newer than the newest commit touching the binaries,
  # someone edited one and did not rebuild the other.
  binaries-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Binaries are at least as new as the source they come from
        run: |
          source_at=$(git log -1 --format=%ct -- cmd internal kit go.mod go.sum)
          binaries_at=$(git log -1 --format=%ct -- skills/narrated-video/bin)

          echo "newest source commit:   $(date -u -d @"$source_at" 2>/dev/null || date -u -r "$source_at")"
          echo "newest binary commit:   $(date -u -d @"$binaries_at" 2>/dev/null || date -u -r "$binaries_at")"

          if [ "$source_at" -gt "$binaries_at" ]; then
            echo "::error::The source changed after the binaries were last built. Run 'make binaries' and commit the result."
            git log --oneline -3 -- cmd internal kit go.mod go.sum
            exit 1
          fi

  # Everything a user does on day one — run against the COMMITTED binary, not a
  # fresh build. That is the artifact people actually install, so it is the one
  # whose behaviour has to be checked; a stale commit fails here rather than in
  # someone's first hour with the tool.
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2

      - name: Scaffold, and expect exactly the two failures a fresh project has
        run: |
          nv="$GITHUB_WORKSPACE/skills/narrated-video/bin/nv"
          mkdir -p /tmp/demo && cd /tmp/demo
          "$nv" init .

          failing=$("$nv" validate --json | jq -r '.[] | select(.OK == false) | .ID' | sort | tr '\n' ' ')
          echo "failing: $failing"
          [ "$failing" = "CHK-05 CHK-06 " ] || { echo "::error::expected CHK-05 and CHK-06, got: $failing"; exit 1; }

      - name: Synthesize with no API key, then expect a clean gate
        run: |
          nv="$GITHUB_WORKSPACE/skills/narrated-video/bin/nv"
          cd /tmp/demo
          "$nv" voiceover
          "$nv" validate

      - name: Regenerating changes nothing
        run: |
          nv="$GITHUB_WORKSPACE/skills/narrated-video/bin/nv"
          cd /tmp/demo
          "$nv" sync
          "$nv" validate

      # A new Remotion release breaking the template should surface here, not in
      # someone's first hour with the tool.
      - name: The scaffolded project type-checks and its compositions resolve
        run: |
          cd /tmp/demo
          bun install
          bunx tsc --noEmit
          bunx remotion compositions src/index.ts
