name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.6"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: go vet ./...
      - run: go test -race ./...

  # Ensures the committed binaries match the source they were built from.
  # For non-fork PRs and pushes to main: builds and commits automatically using
  # RELEASE_PLEASE_TOKEN (a user token) so the bot commit retriggers CI normally.
  # For fork and Dependabot PRs where CI cannot push back: fails with a clear
  # message so the contributor knows to run `make binaries` locally.
  build-binaries:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write
    env:
      # Whether this run can push a rebuilt binary back — which decides both how it
      # authenticates and what it checks out. Fork and Dependabot runs cannot read
      # repository secrets, so RELEASE_PLEASE_TOKEN is empty for them, and a fork's
      # head branch does not exist in this repository to be checked out at all.
      PUSHABLE: ${{ github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]' }}
    steps:
      # When the run can push, check out the branch head rather than the detached
      # merge commit the default PR checkout produces, so the push has somewhere to
      # land. Otherwise take that default, with the run's own read-only token: its
      # history still carries the commit dates the staleness check reads.
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          fetch-depth: 0
          ref: ${{ env.PUSHABLE == 'true' && (github.head_ref || github.ref_name) || '' }}

      - name: Check whether binaries need rebuilding
        id: check
        run: |
          source_at=$(git log -1 --format=%ct -- cmd internal kit go.mod go.sum)
          binaries_at=$(git log -1 --format=%ct -- skills/narrated-video/bin)

          source_at=${source_at:-0}
          binaries_at=${binaries_at:-0}

          echo "newest source commit:   $(date -u -d @"$source_at" 2>/dev/null || date -u -r "$source_at")"
          echo "newest binary commit:   $(date -u -d @"$binaries_at" 2>/dev/null || date -u -r "$binaries_at")"

          if [ "$source_at" -gt "$binaries_at" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail when CI cannot push stale binaries back
        if: steps.check.outputs.needed == 'true' && env.PUSHABLE != 'true'
        run: |
          echo "::error::Binaries are stale and CI cannot push to this branch (fork or Dependabot PR). Run 'make binaries', commit the result, and push."
          git log --oneline -3 -- cmd internal kit go.mod go.sum
          exit 1

      - uses: actions/setup-go@v7.0.0
        if: steps.check.outputs.needed == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Rebuild binaries
        if: steps.check.outputs.needed == 'true'
        run: make binaries

      - name: Commit and push rebuilt binaries
        if: steps.check.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skills/narrated-video/bin
          git commit -m "build: rebuild the nv binary for each platform"
          git push

  # Everything a user does on day one — run against the COMMITTED binary, not a
  # fresh build. That is the artifact people actually install, so it is the one
  # whose behaviour has to be checked; a stale commit fails here rather than in
  # someone's first hour with the tool.
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2

      - name: Scaffold, and expect exactly the two failures a fresh project has
        run: |
          nv="$GITHUB_WORKSPACE/skills/narrated-video/bin/nv"
          mkdir -p /tmp/demo && cd /tmp/demo
          "$nv" init .

          failing=$("$nv" validate --json | jq -r '.[] | select(.OK == false) | .ID' | sort | tr '\n' ' ')
          echo "failing: $failing"
          [ "$failing" = "CHK-05 CHK-06 " ] || { echo "::error::expected CHK-05 and CHK-06, got: $failing"; exit 1; }

      - name: Synthesize with no API key, then expect a clean gate
        run: |
          nv="$GITHUB_WORKSPACE/skills/narrated-video/bin/nv"
          cd /tmp/demo
          "$nv" voiceover
          "$nv" validate

      - name: Regenerating changes nothing
        run: |
          nv="$GITHUB_WORKSPACE/skills/narrated-video/bin/nv"
          cd /tmp/demo
          "$nv" sync
          "$nv" validate

      # A new Remotion release breaking the template should surface here, not in
      # someone's first hour with the tool.
      #
      # Both gates run through `bun run`, never `bunx`. The template installs two
      # compilers — TypeScript 7 for checking, TypeScript 6 because typescript-eslint
      # still needs the API 7.0 dropped — and a bare `bunx tsc` resolves to the 6
      # binary, which would quietly check with the wrong one. The scripts name the
      # compiler explicitly. Linting is gated for the same reason: a lint chain that
      # cannot load its parser fails here rather than in a user's editor.
      #
      # `remotion versions` is the gate CHK-38 cannot be: the check reads what
      # package.json declares, this reads what the resolver actually put on disk,
      # so a transitive @remotion/* arriving on its own version is caught too. It
      # exits 1 on a mismatch — unlike `render` and `compositions`, which print
      # the same warning and exit 0.
      - name: The scaffolded project type-checks, lints, and its compositions resolve
        run: |
          cd /tmp/demo
          bun install
          bunx remotion versions
          bun run typecheck
          bun run lint
          bunx remotion compositions src/index.ts

  # Proves that two renders of the same frame, in separate processes, produce
  # identical bytes. Source checks (CHK-28, CHK-35) catch nondeterminism by
  # reading code; this catches the cases they do not anticipate.
  #
  # Gated on kit/ path changes so a pure Go fix does not pay for a full render.
  # Frame 15 is chosen because it is one frame past the 14-frame lead — the
  # first frame where motion is actually happening — making it the cheapest
  # frame that proves something about the animated state.
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: Skip when kit/ is unchanged
        id: changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^kit/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.changed.outputs.run == 'true'

      - name: Scaffold, voiceover, validate
        if: steps.changed.outputs.run == 'true'
        run: |
          nv="$GITHUB_WORKSPACE/skills/narrated-video/bin/nv"
          mkdir -p /tmp/det && cd /tmp/det
          "$nv" init .
          "$nv" voiceover
          "$nv" validate
          bun install

      # Remotion pins its own Chrome Headless Shell and deliberately ignores a
      # browser installed beside it, so a distro Chrome here was downloaded,
      # never used, and eventually hung the job. Fetching the pinned shell as
      # its own step keeps a download failure legible as a download failure
      # rather than a render that mysteriously produces nothing.
      - name: Fetch the Chrome build Remotion pins
        if: steps.changed.outputs.run == 'true'
        run: cd /tmp/det && bunx remotion browser ensure

      - name: Render frame 15 twice and compare hashes
        if: steps.changed.outputs.run == 'true'
        run: |
          cd /tmp/det
          bunx remotion still Explainer out/still-a.png --frame 15
          bunx remotion still Explainer out/still-b.png --frame 15

          hash_a=$(sha256sum out/still-a.png | awk '{print $1}')
          hash_b=$(sha256sum out/still-b.png | awk '{print $1}')

          echo "render 1: $hash_a"
          echo "render 2: $hash_b"

          if [ "$hash_a" != "$hash_b" ]; then
            echo "::error::frame 15 differs between two renders — the scene is nondeterministic"
            exit 1
          fi

      - name: Upload both frames when renders differ
        if: failure() && steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nondeterministic-frames
          path: /tmp/det/out/still-*.png
